<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>PixelStella · 我的桌面小伙伴</title><link rel="stylesheet" href="styles.css"></head><body>
<a class="skip" href="#main">跳到主要内容</a>
<aside class="sidebar"><div class="brand"><span class="brand-mark">✦</span><div>PixelStella<small>YOUR COMPUTER FRIENDS</small></div></div><p class="sidebar-caption">一点陪伴，一点进步</p><nav aria-label="主导航"><button data-nav="today" aria-label="今日计划"><span class="nav-icon">▦</span><span>今日计划</span></button><button data-nav="avatar" aria-label="角色工坊"><span class="nav-icon">✧</span><span>角色工坊</span></button><button data-nav="focus" aria-label="专注时刻"><span class="nav-icon">◷</span><span>专注时刻</span></button><button data-nav="settings" aria-label="偏好设置"><span class="nav-icon">⚙</span><span>偏好设置</span></button></nav><div class="sidebar-bottom"><span class="offline-dot"></span><span>本地保存 · 无需登录</span></div></aside>
<div class="shell"><header class="topbar"><span>我的桌面小宇宙 <span class="topbar-slash">/</span> <strong id="breadcrumb">今日计划</strong></span><div class="topbar-actions"><label class="language-control"><span aria-hidden="true">◎</span><select id="language" aria-label="Language / 语言 / Langue"><option value="zh">简体中文</option><option value="en">English</option><option value="fr">Français</option></select></label><button id="show-pet" class="text-button">召唤小伙伴</button><span class="local-badge">● OFFLINE FIRST</span></div></header><main id="main" tabindex="-1"><div id="storage-warning" role="alert" hidden></div><div id="view"></div></main><footer class="app-footer"><span>慢慢来，也是向前走。</span><span>PixelStella v0.2.0 · 个人本地版</span></footer></div>
<dialog id="reminder-dialog" aria-labelledby="dialog-title"><form id="reminder-form"><div class="dialog-heading"><div><span class="eyebrow">A LITTLE PLAN</span><h2 id="dialog-title">安排一件小事</h2></div><button type="button" id="close-dialog" class="icon-button" aria-label="关闭计划编辑">×</button></div><input type="hidden" name="id"><label class="field">计划名称<input name="title" required maxlength="60" placeholder="例如：整理今天的数学错题"></label><label class="field">学科或分类<input name="subject" maxlength="20" placeholder="数学、自习、休息……"></label><div class="form-row"><label class="field">开始日期<input type="date" name="date" required></label><label class="field">提醒时间<input type="time" name="time" required></label></div><label class="field">重复方式<select name="repeat" aria-label="重复方式"><option value="once">只提醒一次</option><option value="daily">每天</option><option value="weekdays">每周一至周五</option></select></label><label class="field">给自己的小提示<textarea name="note" maxlength="300" rows="3" placeholder="可以留空，也可以写一句鼓励自己的话。"></textarea></label><p class="form-help">提醒需要PixelStella保持运行。关闭主窗口后仍在托盘运行；彻底退出后无法提醒。</p><p id="form-error" class="error-text" role="alert"></p><div class="dialog-footer"><button type="button" id="cancel-dialog" class="button secondary">先不安排</button><button class="button primary" type="submit">保存计划 <span>↗</span></button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
